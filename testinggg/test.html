<!DOCTYPE html>
<html lang="en">
<head>

    <title>DevOps Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            text-align: center;
            padding: 50px;

        .container {

            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);

        }
        h1 {
            color: #2c3e50;
        }

        }

            font-weight: bold;
            color: green;

</head>
<body>

    <div class="container">
        <h1>Hello 👋</h1>
        <p>I am a DevOps Engineer</p>

        <div class="status">
            ✅ Application is running successfully!
        </div>
    </div>

</body>
</html>
